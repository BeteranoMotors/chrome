<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beterano Motors App Chrome</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0a0a0a;
      }

      #btr-startup-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 46%, rgba(245, 216, 77, 0.34) 0%, rgba(245, 216, 77, 0.16) 20%, rgba(245, 216, 77, 0.04) 42%, transparent 62%),
          radial-gradient(circle at 50% 45%, rgba(255, 250, 214, 0.08), transparent 48%),
          linear-gradient(180deg, #15120c 0%, #0d0d0b 52%, #080808 100%);
        z-index: 100500;
        opacity: 1;
        visibility: visible;
        transition:
          opacity 0.95s ease,
          visibility 0.95s ease;
      }

      #btr-startup-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .btr-startup-splash__logo-wrap {
        width: min(520px, 80vw);
        aspect-ratio: 1 / 1;
        display: grid;
        place-items: center;
        animation: btr-splash-pulse 2.15s ease-in-out infinite alternate;
      }

      .btr-startup-splash__logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        filter:
          brightness(0) saturate(100%) invert(87%) sepia(28%) saturate(1026%) hue-rotate(355deg) brightness(102%) contrast(95%)
          drop-shadow(0 0 64px rgba(245, 216, 77, 0.38));
      }

      @keyframes btr-splash-pulse {
        from {
          transform: scale(0.97);
          opacity: 0.92;
        }

        to {
          transform: scale(1.02);
          opacity: 1;
        }
      }
    </style>
    <script>
      (function setupBeteranoStartupSplash() {
        const MIN_SHOW_MS = 2600;
        const HARD_MAX_MS = 8000;
        const startedAt = performance?.now?.() ?? Date.now();

        const hideSplash = () => {
          const splash = document.getElementById("btr-startup-splash");
          if (!splash || splash.classList.contains("is-hidden")) return;
          splash.classList.add("is-hidden");
          window.setTimeout(() => splash.remove(), 1050);
        };

        const scheduleHide = () => {
          const elapsed = (performance?.now?.() ?? Date.now()) - startedAt;
          window.setTimeout(hideSplash, Math.max(0, MIN_SHOW_MS - elapsed));
        };

        window.addEventListener("btr:app-ready", scheduleHide, { once: true });
        window.setTimeout(hideSplash, HARD_MAX_MS);
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-CuVsWCEd.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CWeLsmAh.css">
  </head>
  <body>
    <div id="btr-startup-splash" aria-hidden="true">
      <div class="btr-startup-splash__logo-wrap">
        <img
          class="btr-startup-splash__logo"
          src="/logo_loading.svg"
          alt="Beterano"
          fetchpriority="high"
        />
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>
