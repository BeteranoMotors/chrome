<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>BETERANO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <!-- Contenedor para inyectar el header -->
  <div id="header-container"></div>

  <!-- Demo simple de la página -->
  <div id="root" style="padding:16px">
    <h1>Bienvenido a BETERANO</h1>
    <p>Estamos construyendo la web. Próximamente más contenido.</p>
    <p><small>El botón “Login” debería aparecer en la barra superior.</small></p>
  </div>

  <!-- Fallback de configuración pública de Firebase (mientras no exista /config/public) -->
  <script>
    // Rellena estos valores con tu proyecto Firebase:
    window.BTR_FIREBASE_API_KEY        = window.BTR_FIREBASE_API_KEY        || "TU_API_KEY";
    window.BTR_FIREBASE_AUTH_DOMAIN    = window.BTR_FIREBASE_AUTH_DOMAIN    || "TU_PROYECTO.firebaseapp.com";
    window.BTR_FIREBASE_PROJECT_ID     = window.BTR_FIREBASE_PROJECT_ID     || "TU_PROYECTO";
    window.BTR_FIREBASE_APP_ID         = window.BTR_FIREBASE_APP_ID         || "1:XXXX:web:YYYY";
    window.BTR_FIREBASE_STORAGE_BUCKET = window.BTR_FIREBASE_STORAGE_BUCKET || "TU_PROYECTO.appspot.com";
  </script>

  <!-- Carga del header (local/gh-pages auto-resuelto por el loader) -->
  <script src="./components/header/header-loader.js" defer></script>
</body>
</html>
